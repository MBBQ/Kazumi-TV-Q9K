name: TV Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    name: Analyze and build TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings

      - name: Build ARM APKs
        run: flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=KAZUMI_TV=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-tv-q9k-apk
          path: build/app/outputs/flutter-apk/app-release.apk
